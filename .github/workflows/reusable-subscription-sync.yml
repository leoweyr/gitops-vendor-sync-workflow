name: Reusable Subscription Source Sync Engine


on:
  workflow_call:
    inputs:
      vendor_config:
        description: 'Path to the consumer repository vendor configuration.'
        required: false
        type: string
        default: 'gitops-vendor.json'
      before_sha:
        description: 'Commit SHA from before the current push event.'
        required: true
        type: string
      subscribers_file:
        description: 'Path to the consumer repository list file in the shared code repository.'
        required: false
        type: string
        default: 'gitops-subscribers.json'
      target_branch:
        description: 'Branch that receives subscriber list updates.'
        required: false
        type: string
        default: 'develop'
    secrets:
      ACCESS_TOKEN:
        description: 'GitHub token with access to update subscriber lists in shared code repositories.'
        required: true


jobs:
  detect_shared_repo_change:
    runs-on: ubuntu-latest
    outputs:
      has_removed: ${{ steps.detect.outputs.has_removed }}
      has_added: ${{ steps.detect.outputs.has_added }}
      removed_repos: ${{ steps.detect.outputs.removed_repos }}
      added_repos: ${{ steps.detect.outputs.added_repos }}
    steps:
      - name: 👣 Track Workflow Run
        continue-on-error: true
        run: |
          curl -s "https://abacus.jasoncameron.dev/hit/leoweyr/gitops-vendor-sync-workflow-usage" > /dev/null

      - name: '📥 Checkout Consumer Repository'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: '🔍 Detect Shared Repository Change'
        id: detect
        env:
          VENDOR_CONFIG: ${{ inputs.vendor_config }}
          BEFORE_SHA: ${{ inputs.before_sha }}
        run: |
          # Parse current and previous repos, supporting both single object and array formats.
          OLD_REPOS_JSON=$(if [ -n "$BEFORE_SHA" ] && git cat-file -e "$BEFORE_SHA:$VENDOR_CONFIG" 2>/dev/null; then
            git show "$BEFORE_SHA:$VENDOR_CONFIG" | jq -c 'if type == "array" then [.[].shared_repo] else [.shared_repo // .upstream_repo] end | map(select(. != null))'
          else
            echo '[]'
          fi)
          
          NEW_REPOS_JSON=$(jq -c 'if type == "array" then [.[].shared_repo] else [.shared_repo // .upstream_repo] end | map(select(. != null))' "$VENDOR_CONFIG")

          REMOVED_REPOS=$(jq -nc --argjson old "$OLD_REPOS_JSON" --argjson new "$NEW_REPOS_JSON" '$old - $new')
          ADDED_REPOS=$(jq -nc --argjson old "$OLD_REPOS_JSON" --argjson new "$NEW_REPOS_JSON" '$new - $old')

          echo "removed_repos=$REMOVED_REPOS" >> "$GITHUB_OUTPUT"
          echo "added_repos=$ADDED_REPOS" >> "$GITHUB_OUTPUT"
          
          if [ "$(echo "$REMOVED_REPOS" | jq 'length')" -gt 0 ]; then
            echo "has_removed=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_removed=false" >> "$GITHUB_OUTPUT"
          fi

          if [ "$(echo "$ADDED_REPOS" | jq 'length')" -gt 0 ]; then
            echo "has_added=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_added=false" >> "$GITHUB_OUTPUT"
          fi

  remove_subscriber_from_old_shared_repos:
    if: ${{ needs.detect_shared_repo_change.outputs.has_removed == 'true' }}
    needs:
      - detect_shared_repo_change
    runs-on: ubuntu-latest
    strategy:
      matrix:
        repo: ${{ fromJson(needs.detect_shared_repo_change.outputs.removed_repos) }}
    steps:
      - name: '🛠️ Dispatch Unsubscribe Request'
        env:
          GH_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          TARGET_SHARED_REPO: ${{ matrix.repo }}
          SUBSCRIBERS_FILE: ${{ inputs.subscribers_file }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/$TARGET_SHARED_REPO/actions/workflows/vendor-broadcast.yml/dispatches" \
            -f ref="$TARGET_BRANCH" \
            -f "inputs[subscriber_action]=remove" \
            -f "inputs[subscriber_repository]=${{ github.repository }}" \
            -f "inputs[subscribers_file]=$SUBSCRIBERS_FILE" \
            -f "inputs[target_branch]=$TARGET_BRANCH"

  add_subscriber_to_new_shared_repos:
    if: ${{ needs.detect_shared_repo_change.outputs.has_added == 'true' }}
    needs:
      - detect_shared_repo_change
    runs-on: ubuntu-latest
    strategy:
      matrix:
        repo: ${{ fromJson(needs.detect_shared_repo_change.outputs.added_repos) }}
    steps:
      - name: '🛠️ Dispatch Subscribe Request'
        env:
          GH_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          TARGET_SHARED_REPO: ${{ matrix.repo }}
          SUBSCRIBERS_FILE: ${{ inputs.subscribers_file }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/$TARGET_SHARED_REPO/actions/workflows/vendor-broadcast.yml/dispatches" \
            -f ref="$TARGET_BRANCH" \
            -f "inputs[subscriber_action]=add" \
            -f "inputs[subscriber_repository]=${{ github.repository }}" \
            -f "inputs[subscribers_file]=$SUBSCRIBERS_FILE" \
            -f "inputs[target_branch]=$TARGET_BRANCH"
