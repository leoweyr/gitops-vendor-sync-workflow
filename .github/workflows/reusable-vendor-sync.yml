name: Reusable Vendor Sync Engine


on:
  workflow_call:
    inputs:
      vendor_config:
        description: 'Path to the dependency manifest in the consumer repository.'
        required: false
        type: string
        default: 'gitops-vendor.json'
      target_shared_repository:
        description: 'Specific shared repository to sync. If omitted, all sources in the config will be synced.'
        required: false
        type: string
    secrets:
      ACCESS_TOKEN:
        description: 'GitHub token with read access to the shared code repository and write access to the consumer repository.'
        required: true


jobs:
  materialize_dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: 👣 Track Workflow Run
        continue-on-error: true
        run: |
          curl -s "https://abacus.jasoncameron.dev/hit/leoweyr/gitops-vendor-sync-workflow-usage" > /dev/null

      - name: '📥 Checkout Downstream Repo'
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ACCESS_TOKEN }}
          fetch-depth: 0

      - name: '📂 Fetch and Vendor Files'
        env:
          GH_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          CONFIG_FILE: ${{ inputs.vendor_config }}
          TARGET_SHARED_REPOSITORY: ${{ inputs.target_shared_repository }}
        run: |
          if [ ! -f "$CONFIG_FILE" ]; then
            echo "❌ Error: Vendor config not found at $CONFIG_FILE."
            exit 1
          fi

          normalize_semver() {
            local raw_version="$1"
          
            if [[ "$raw_version" =~ ^([\^~])v(.+)$ ]]; then
              echo "${BASH_REMATCH[1]}${BASH_REMATCH[2]}"
            else
              echo "${raw_version#v}"
            fi
          }

          parse_semver() {
            local normalized_version cleaned_version
            normalized_version=$(normalize_semver "$1")
            cleaned_version="${normalized_version%%-*}"
            cleaned_version="${cleaned_version%%+*}"
          
            if [[ "$cleaned_version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "${BASH_REMATCH[1]} ${BASH_REMATCH[2]} ${BASH_REMATCH[3]}"
            else
              return 1
            fi
          }

          semver_compare() {
            local a_major a_minor a_patch b_major b_minor b_patch
            read -r a_major a_minor a_patch <<< "$(parse_semver "$1")" || return 1
            read -r b_major b_minor b_patch <<< "$(parse_semver "$2")" || return 1

            if [ "$a_major" -gt "$b_major" ]; then
              echo 1
              return
            fi
          
            if [ "$a_major" -lt "$b_major" ]; then
              echo -1
              return
            fi
          
            if [ "$a_minor" -gt "$b_minor" ]; then
              echo 1
              return
            fi
          
            if [ "$a_minor" -lt "$b_minor" ]; then
              echo -1
              return
            fi
          
            if [ "$a_patch" -gt "$b_patch" ]; then
              echo 1
              return
            fi
          
            if [ "$a_patch" -lt "$b_patch" ]; then
              echo -1
              return
            fi
          
            echo 0
          }

          semver_greater_than_or_equal() {
            local comparison_result
            comparison_result=$(semver_compare "$1" "$2") || return 1
            [ "$comparison_result" -ge 0 ]
          }

          semver_greater_than() {
            local comparison_result
            comparison_result=$(semver_compare "$1" "$2") || return 1
            [ "$comparison_result" -gt 0 ]
          }

          semver_less_than() {
            local comparison_result
            comparison_result=$(semver_compare "$1" "$2") || return 1
            [ "$comparison_result" -lt 0 ]
          }

          version_satisfies_range() {
            local version range normalized_version normalized_range
            local major minor patch lower upper base_version

            version="$1"
            range="$2"
            normalized_version=$(normalize_semver "$version")
            normalized_range=$(normalize_semver "$range")

            if ! parse_semver "$normalized_version" >/dev/null; then
              return 1
            fi

            case "$normalized_range" in
              ^*)
                base_version="${normalized_range#^}"
                read -r major minor patch <<< "$(parse_semver "$base_version")" || return 1
                lower="$major.$minor.$patch"
          
                if [ "$major" -gt 0 ]; then
                  upper="$((major + 1)).0.0"
                elif [ "$minor" -gt 0 ]; then
                  upper="0.$((minor + 1)).0"
                else
                  upper="0.0.$((patch + 1))"
                fi
          
                semver_greater_than_or_equal "$normalized_version" "$lower" && semver_less_than "$normalized_version" "$upper"
                ;;
              ~*)
                base_version="${normalized_range#~}"
                read -r major minor patch <<< "$(parse_semver "$base_version")" || return 1
                lower="$major.$minor.$patch"
                upper="$major.$((minor + 1)).0"
                semver_greater_than_or_equal "$normalized_version" "$lower" && semver_less_than "$normalized_version" "$upper"
                ;;
              *.[xX])
          
                if [[ "$normalized_range" =~ ^([0-9]+)\.([0-9]+)\.[xX]$ ]]; then
                  major="${BASH_REMATCH[1]}"
                  minor="${BASH_REMATCH[2]}"
                  lower="$major.$minor.0"
                  upper="$major.$((minor + 1)).0"
                elif [[ "$normalized_range" =~ ^([0-9]+)\.[xX]$ ]]; then
                  major="${BASH_REMATCH[1]}"
                  lower="$major.0.0"
                  upper="$((major + 1)).0.0"
                else
                  return 1
                fi
          
                semver_greater_than_or_equal "$normalized_version" "$lower" && semver_less_than "$normalized_version" "$upper"
                ;;
              *)
          
                if [[ "$normalized_range" =~ ^([0-9]+)$ ]]; then
                  major="${BASH_REMATCH[1]}"
                  lower="$major.0.0"
                  upper="$((major + 1)).0.0"
                  semver_greater_than_or_equal "$normalized_version" "$lower" && semver_less_than "$normalized_version" "$upper"
                elif [[ "$normalized_range" =~ ^([0-9]+)\.([0-9]+)$ ]]; then
                  major="${BASH_REMATCH[1]}"
                  minor="${BASH_REMATCH[2]}"
                  lower="$major.$minor.0"
                  upper="$major.$((minor + 1)).0"
                  semver_greater_than_or_equal "$normalized_version" "$lower" && semver_less_than "$normalized_version" "$upper"
                else
                  read -r major minor patch <<< "$(parse_semver "$normalized_range")" || return 1
                  [ "$normalized_version" = "$major.$minor.$patch" ]
                fi
                ;;
            esac
          }

          # Normalize config to an array of sources to support multi-source sync.
          SOURCES_JSON=$(jq -c --arg target "$TARGET_SHARED_REPOSITORY" '
            (if type == "array" then . else [.] end) |
            if ($target != "") then
              map(select((.shared_repo // .upstream_repo) == $target))
            else
              .
            end
          ' "$CONFIG_FILE")

          if [ "$(echo "$SOURCES_JSON" | jq 'length')" -eq 0 ]; then
            if [ -n "$TARGET_SHARED_REPOSITORY" ]; then
              echo "✅ No configuration found for targeted repository $TARGET_SHARED_REPOSITORY."
              
              exit 0
            fi
            echo "❌ Error: No sources found in vendor config."
            
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          COMMITS_CREATED=0

          while read -r SOURCE_CONFIG; do
            SHARED_REPOSITORY=$(echo "$SOURCE_CONFIG" | jq -r '.shared_repo // .upstream_repo // empty')
            SHARED_MANIFEST_REFERENCE=$(echo "$SOURCE_CONFIG" | jq -r '.shared_manifest_ref // "main"')
            SHARED_CONFIG_PATH='gitops-shared.json'

            if [ -z "$SHARED_REPOSITORY" ]; then
              echo "❌ Error: Shared repository is required in vendor config."
              
              exit 1
            fi

            if ! echo "$SOURCE_CONFIG" | jq -e '.dependencies | type == "array"' >/dev/null; then
              echo "❌ Error: Each source in vendor config must define a dependencies array."
              
              exit 1
            fi

            SHARED_CONFIG_TEMPORARY_FILE=$(mktemp)
          
            if ! gh api \
              -H 'Accept: application/vnd.github.v3.raw' \
              "/repos/$SHARED_REPOSITORY/contents/$SHARED_CONFIG_PATH?ref=$SHARED_MANIFEST_REFERENCE" \
              > "$SHARED_CONFIG_TEMPORARY_FILE"; then
              echo "❌ Error: Failed to download shared config from $SHARED_REPOSITORY at $SHARED_CONFIG_PATH (ref: $SHARED_MANIFEST_REFERENCE)."
              
              rm -f "$SHARED_CONFIG_TEMPORARY_FILE"
              
              exit 1
            fi

            if ! jq -e 'type == "array"' "$SHARED_CONFIG_TEMPORARY_FILE" >/dev/null; then
              echo "❌ Error: Shared config from $SHARED_REPOSITORY must be a JSON array."
          
              rm -f "$SHARED_CONFIG_TEMPORARY_FILE"
          
              exit 1
            fi

            LOCK_FILE='gitops-vendor-lock.json'
          
            if [ ! -f "$LOCK_FILE" ]; then
              echo '{}' > "$LOCK_FILE"
            fi

            if ! jq -e 'type == "object"' "$LOCK_FILE" >/dev/null; then
              echo "❌ Error: Lock file must be a JSON object at $LOCK_FILE."
          
              rm -f "$SHARED_CONFIG_TEMPORARY_FILE"

              exit 1
            fi

            while read -r item; do
              ITEM_IDENTIFIER=$(echo "$item" | jq -r '.id // empty')
              ITEM_VERSION_RANGE=$(echo "$item" | jq -r '.version // empty')
              ITEM_TARGET_DIRECTORY=$(echo "$item" | jq -r '.target_dir // empty')
              LEGACY_TARGET=$(echo "$item" | jq -r '.target // empty')

              if [ -z "$ITEM_IDENTIFIER" ] || [ -z "$ITEM_VERSION_RANGE" ]; then
                echo "❌ Error: Each dependencies item must define id and version."
          
                rm -f "$SHARED_CONFIG_TEMPORARY_FILE"
          
                exit 1
              fi

              CANDIDATES=$(jq -c --arg id "$ITEM_IDENTIFIER" '
                [
                  .[] | select(.id == $id) as $f |
                  if (($f.versions // null) | type) == "array" then
                    $f.versions[] | {
                      version: .version,
                      source: (.source // $f.source // empty),
                      ref: (.ref // $f.ref // empty)
                    }
                  else
                    {
                      version: ($f.version // empty),
                      source: ($f.source // empty),
                      ref: ($f.ref // empty)
                    }
                  end
                ] | map(select(.version != "" and .source != ""))
              ' "$SHARED_CONFIG_TEMPORARY_FILE")

              if [ "$(echo "$CANDIDATES" | jq 'length')" -eq 0 ]; then
                echo "❌ Error: No shared code item found for id '$ITEM_IDENTIFIER' in $SHARED_REPOSITORY."
          
                rm -f "$SHARED_CONFIG_TEMPORARY_FILE"
          
                exit 1
              fi

              MATCHED_VERSION=''
              MATCHED_SOURCE=''
              MATCHED_REFERENCE=''

              while IFS= read -r candidate; do
                CANDIDATE_VERSION=$(echo "$candidate" | jq -r '.version')
                CANDIDATE_SOURCE=$(echo "$candidate" | jq -r '.source')
                CANDIDATE_REFERENCE=$(echo "$candidate" | jq -r '.ref // empty')

                if version_satisfies_range "$CANDIDATE_VERSION" "$ITEM_VERSION_RANGE"; then
                  if [ -z "$MATCHED_VERSION" ] || semver_greater_than "$CANDIDATE_VERSION" "$MATCHED_VERSION"; then
                    MATCHED_VERSION="$CANDIDATE_VERSION"
                    MATCHED_SOURCE="$CANDIDATE_SOURCE"
                    MATCHED_REFERENCE="$CANDIDATE_REFERENCE"
                  fi
                fi
              done <<< "$(echo "$CANDIDATES" | jq -c '.[]')"

              if [ -z "$MATCHED_VERSION" ]; then
                echo "⏳ No compatible version found for id '$ITEM_IDENTIFIER' with range '$ITEM_VERSION_RANGE' in $SHARED_REPOSITORY."
                continue
              fi

              if [ -n "$ITEM_TARGET_DIRECTORY" ]; then
                mkdir -p "$ITEM_TARGET_DIRECTORY"
                TARGET_PATH="${ITEM_TARGET_DIRECTORY%/}/$(basename "$MATCHED_SOURCE")"
              elif [ -n "$LEGACY_TARGET" ]; then
                mkdir -p "$(dirname "$LEGACY_TARGET")"
                TARGET_PATH="$LEGACY_TARGET"
              else
                echo "❌ Error: Each dependencies item must define target_dir (or legacy target)."
          
                rm -f "$SHARED_CONFIG_TEMPORARY_FILE"
          
                exit 1
              fi

              EFFECTIVE_REFERENCE="$SHARED_MANIFEST_REFERENCE"
              if [ -n "$MATCHED_REFERENCE" ]; then
                EFFECTIVE_REFERENCE="$MATCHED_REFERENCE"
              fi

              HAS_PREVIOUS=$(jq -r --arg id "$ITEM_IDENTIFIER" 'has($id)' "$LOCK_FILE")
              OLD_VERSION=''
              OLD_PATH=''
             
              if [ "$HAS_PREVIOUS" = 'true' ]; then
                OLD_VERSION=$(jq -r --arg id "$ITEM_IDENTIFIER" '.[$id].version // empty' "$LOCK_FILE")
                OLD_VERSION=$(normalize_semver "$OLD_VERSION")
                OLD_PATH=$(jq -r --arg id "$ITEM_IDENTIFIER" '.[$id].path // .[$id].target_path // empty' "$LOCK_FILE")
              fi
             
              NEW_VERSION=$(normalize_semver "$MATCHED_VERSION")

              echo "📂 Vendoring $ITEM_IDENTIFIER@$NEW_VERSION from $MATCHED_SOURCE to $TARGET_PATH."

              if [ "$HAS_PREVIOUS" = 'true' ] && [ "$OLD_VERSION" = "$NEW_VERSION" ] && [ -n "$OLD_PATH" ] && [ "$OLD_PATH" != "$TARGET_PATH" ]; then
                echo "❌ Error: Path change for id '$ITEM_IDENTIFIER' requires a version bump (from $OLD_PATH to $TARGET_PATH)."
          
                rm -f "$SHARED_CONFIG_TEMPORARY_FILE"
          
                exit 1
              fi

              if [ "$HAS_PREVIOUS" = 'true' ] && [ "$OLD_VERSION" != "$NEW_VERSION" ] && [ -n "$OLD_PATH" ] && [ "$OLD_PATH" != "$TARGET_PATH" ]; then
                if [ -e "$OLD_PATH" ] && [ ! -f "$OLD_PATH" ]; then
                  echo "❌ Error: Previous vendored path is not a file at $OLD_PATH."
          
                  rm -f "$SHARED_CONFIG_TEMPORARY_FILE"
          
                  exit 1
                fi

                rm -f -- "$OLD_PATH"
                git add -A -- "$OLD_PATH"
                echo "🔄 Replaced vendored file path for id '$ITEM_IDENTIFIER' from $OLD_PATH to $TARGET_PATH."
              fi

              if ! gh api \
                -H 'Accept: application/vnd.github.v3.raw' \
                "/repos/$SHARED_REPOSITORY/contents/$MATCHED_SOURCE?ref=$EFFECTIVE_REFERENCE" \
                > "$TARGET_PATH"; then
                echo "❌ Error: Failed to fetch $MATCHED_SOURCE (id: $ITEM_IDENTIFIER, version: $MATCHED_VERSION from $SHARED_REPOSITORY)."
                
                rm -f "$SHARED_CONFIG_TEMPORARY_FILE"
                
                exit 1
              fi

              LOCK_TEMPORARY_FILE=$(mktemp)
            
              if ! jq \
                --arg id "$ITEM_IDENTIFIER" \
                --arg version "$NEW_VERSION" \
                --arg path "$TARGET_PATH" \
                '.[$id] = { version: $version, path: $path }' \
                "$LOCK_FILE" > "$LOCK_TEMPORARY_FILE"; then
                echo "❌ Error: Failed to update lock file for id '$ITEM_IDENTIFIER'."
         
                rm -f "$LOCK_TEMPORARY_FILE" "$SHARED_CONFIG_TEMPORARY_FILE"
                
                exit 1
              fi
            
              mv "$LOCK_TEMPORARY_FILE" "$LOCK_FILE"

              git add -- "$TARGET_PATH" "$LOCK_FILE"

              if git diff --cached --quiet -- "$TARGET_PATH" "$LOCK_FILE"; then
                echo "✅ No file changes detected for id '$ITEM_IDENTIFIER'."
                continue
              fi

              if [ "$HAS_PREVIOUS" = 'true' ] && [ "$OLD_VERSION" = "$NEW_VERSION" ] && [ "$OLD_PATH" = "$TARGET_PATH" ]; then
                echo "❌ Error: Detected file changes for id '$ITEM_IDENTIFIER' without a version change."
                
                rm -f "$SHARED_CONFIG_TEMPORARY_FILE"
                
                exit 1
              fi

              if [ "$HAS_PREVIOUS" = 'true' ]; then
                COMMIT_MESSAGE="chore(deps): bump $ITEM_IDENTIFIER from $OLD_VERSION to $NEW_VERSION"
              else
                COMMIT_MESSAGE="chore(deps): add $ITEM_IDENTIFIER $NEW_VERSION"
              fi

              git commit -m "$COMMIT_MESSAGE"
              COMMITS_CREATED=$((COMMITS_CREATED + 1))
            
            done < <(echo "$SOURCE_CONFIG" | jq -c '.dependencies[]')
            rm -f "$SHARED_CONFIG_TEMPORARY_FILE"
          done < <(echo "$SOURCES_JSON" | jq -c '.[]')

          if [ "$COMMITS_CREATED" -gt 0 ]; then
            echo "🚀 Pushing $COMMITS_CREATED dependency commit(s) to develop."
          
            ATTEMPT=1
            MAX_ATTEMPTS=5
            
            while [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; do
              if git push origin HEAD:develop; then
                break
              fi

              if [ "$ATTEMPT" -eq "$MAX_ATTEMPTS" ]; then
                echo "❌ Error: Failed to push dependency commits after $MAX_ATTEMPTS attempts."
          
                exit 1
              fi

              echo "⏳ Push rejected, rebasing on latest develop and retrying (attempt $((ATTEMPT + 1))/$MAX_ATTEMPTS)."
              
              ATTEMPT=$((ATTEMPT + 1))

              git fetch origin develop
          
              if ! git rebase origin/develop; then
                echo "❌ Error: Failed to rebase dependency commits on latest develop."
                
                git rebase --abort || true
                
                exit 1
              fi
            done
          else
            echo "✅ No dependency updates detected."
          fi
