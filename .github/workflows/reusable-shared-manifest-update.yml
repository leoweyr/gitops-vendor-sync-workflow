name: Reusable Shared Manifest Update Engine


on:
  workflow_call:
    inputs:
      shared_config:
        description: 'Path to the shared code manifest file in the shared code repository root.'
        required: false
        type: string
        default: 'gitops-shared.json'
      shared_tag:
        description: 'Tag name to parse by using the format shared/<id>/v<version>.'
        required: false
        type: string
        default: ''
      target_branch:
        description: 'Branch that receives shared manifest updates.'
        required: false
        type: string
        default: 'develop'
    secrets:
      ACCESS_TOKEN:
        description: 'GitHub token with write access to the shared code repository.'
        required: true


jobs:
  update_shared_manifest:
    runs-on: ubuntu-latest
    steps:
      - name: 👣 Track Workflow Run
        continue-on-error: true
        run: |
          curl -s "https://abacus.jasoncameron.dev/hit/leoweyr/gitops-vendor-sync-workflow-usage" > /dev/null

      - name: '📥 Checkout Shared Code Repository'
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ACCESS_TOKEN }}
          ref: ${{ inputs.target_branch }}
          fetch-depth: 0

      - name: '🛠️ Update Shared Manifest'
        id: update_manifest
        env:
          CONFIG_FILE: ${{ inputs.shared_config }}
          SHARED_TAG_INPUT: ${{ inputs.shared_tag }}
        run: |
          echo "manifest_updated=false" >> "$GITHUB_OUTPUT"
          echo "shared_id=" >> "$GITHUB_OUTPUT"
          echo "shared_version=" >> "$GITHUB_OUTPUT"

          if [ ! -f "$CONFIG_FILE" ]; then
            echo "❌ Error: Shared manifest not found at $CONFIG_FILE."
            exit 1
          fi

          if ! jq -e 'type == "array"' "$CONFIG_FILE" >/dev/null; then
            echo "❌ Error: Shared manifest must be a JSON array."
            exit 1
          fi

          SHARED_TAG="${SHARED_TAG_INPUT#refs/tags/}"
          
          if ! [[ "$SHARED_TAG" =~ ^shared/([^/]+)/v(.+)$ ]]; then
            echo "✅ Skipping shared manifest update because shared tag format does not match."
            exit 0
          fi

          SHARED_ID="${BASH_REMATCH[1]}"
          SHARED_VERSION="${BASH_REMATCH[2]#v}"
          SHARED_REF="refs/tags/$SHARED_TAG"

          if [ -z "$SHARED_VERSION" ]; then
            echo "❌ Error: Shared version cannot be empty."
            exit 1
          fi

          echo "shared_id=$SHARED_ID" >> "$GITHUB_OUTPUT"
          echo "shared_version=$SHARED_VERSION" >> "$GITHUB_OUTPUT"

          if ! jq -e --arg id "$SHARED_ID" 'any(.[]; .id == $id)' "$CONFIG_FILE" >/dev/null; then
            echo "❌ Error: Shared id '$SHARED_ID' does not exist in $CONFIG_FILE."
            exit 1
          fi

          if jq -e --arg id "$SHARED_ID" --arg version "$SHARED_VERSION" '
            any(
              .[];
              .id == $id and (
                (.version // "") == $version or
                any((.versions // [])[]; (.version // "") == $version)
              )
            )
          ' "$CONFIG_FILE" >/dev/null; then
            echo "✅ Shared id '$SHARED_ID' already contains version '$SHARED_VERSION'."
            exit 0
          fi

          SOURCE_PATH=$(jq -r --arg id "$SHARED_ID" '
            first(
              .[]
              | select(.id == $id)
              | ((.versions // [] | last? | .source // empty), (.source // empty))
              | select(. != "")
            ) // empty
          ' "$CONFIG_FILE")

          if [ -z "$SOURCE_PATH" ]; then
            echo "❌ Error: Cannot infer source path for id '$SHARED_ID'."
            exit 1
          fi

          TMP_FILE=$(mktemp)
          
          if ! jq \
            --arg id "$SHARED_ID" \
            --arg version "$SHARED_VERSION" \
            --arg source "$SOURCE_PATH" \
            --arg ref "$SHARED_REF" \
            '
            map(
              if .id != $id then
                .
              else
                if ((.versions // null) | type) == "array" then
                  (
                    . + {
                      versions: (
                        .versions + [
                          ({ version: $version, source: $source } + (if $ref != "" then { ref: $ref } else {} end))
                        ]
                      )
                    }
                  )
                  | del(.version, .source, .ref)
                else
                  . as $item
                  | (
                      $item + {
                        versions: (
                          [
                            ({ version: ($item.version // empty), source: ($item.source // empty) } + (if ($item.ref // "") != "" then { ref: $item.ref } else {} end)),
                            ({ version: $version, source: $source } + (if $ref != "" then { ref: $ref } else {} end))
                          ]
                          | map(select(.version != "" and .source != ""))
                        )
                      }
                    )
                  | del(.version, .source, .ref)
                end
              end
            )
            ' "$CONFIG_FILE" > "$TMP_FILE"; then
            echo "❌ Error: Failed to update shared manifest."
            rm -f "$TMP_FILE"
            exit 1
          fi

          mv "$TMP_FILE" "$CONFIG_FILE"
          echo "manifest_updated=true" >> "$GITHUB_OUTPUT"

      - name: '📝 Commit Shared Manifest Update'
        if: ${{ steps.update_manifest.outputs.manifest_updated == 'true' }}
        env:
          CONFIG_FILE: ${{ inputs.shared_config }}
          SHARED_ID: ${{ steps.update_manifest.outputs.shared_id }}
          SHARED_VERSION: ${{ steps.update_manifest.outputs.shared_version }}
          SHARED_TAG_INPUT: ${{ inputs.shared_tag }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          if git diff --quiet -- "$CONFIG_FILE"; then
            echo "✅ Shared manifest is already up to date."
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          apply_manifest_update() {
            if jq -e --arg id "$SHARED_ID" --arg version "$SHARED_VERSION" '
              any(
                .[];
                .id == $id and (
                  (.version // "") == $version or
                  any((.versions // [])[]; (.version // "") == $version)
                )
              )
            ' "$CONFIG_FILE" >/dev/null; then
              return 2
            fi

            SOURCE_PATH=$(jq -r --arg id "$SHARED_ID" '
              first(
                .[]
                | select(.id == $id)
                | ((.versions // [] | last? | .source // empty), (.source // empty))
                | select(. != "")
              ) // empty
            ' "$CONFIG_FILE")

            if [ -z "$SOURCE_PATH" ]; then
              echo "❌ Error: Cannot infer source path for id '$SHARED_ID'."
              return 1
            fi

            SHARED_TAG="${SHARED_TAG_INPUT#refs/tags/}"
            SHARED_REF=''
          
            if [ -n "$SHARED_TAG" ]; then
              SHARED_REF="refs/tags/$SHARED_TAG"
            fi

            TMP_FILE=$(mktemp)

            if ! jq \
              --arg id "$SHARED_ID" \
              --arg version "$SHARED_VERSION" \
              --arg source "$SOURCE_PATH" \
              --arg ref "$SHARED_REF" \
              '
              map(
                if .id != $id then
                  .
                else
                  if ((.versions // null) | type) == "array" then
                    (
                      . + {
                        versions: (
                          .versions + [
                            ({ version: $version, source: $source } + (if $ref != "" then { ref: $ref } else {} end))
                          ]
                        )
                      }
                    )
                    | del(.version, .source, .ref)
                  else
                    . as $item
                    | (
                        $item + {
                          versions: (
                            [
                              ({ version: ($item.version // empty), source: ($item.source // empty) } + (if ($item.ref // "") != "" then { ref: $item.ref } else {} end)),
                              ({ version: $version, source: $source } + (if $ref != "" then { ref: $ref } else {} end))
                            ]
                            | map(select(.version != "" and .source != ""))
                          )
                        }
                      )
                    | del(.version, .source, .ref)
                  end
                end
              )
              ' "$CONFIG_FILE" > "$TMP_FILE"; then
              echo "❌ Error: Failed to update shared manifest during retry."
              rm -f "$TMP_FILE"
          
              return 1
            fi

            mv "$TMP_FILE" "$CONFIG_FILE"
            return 0
          }

          ATTEMPT=1
          MAX_ATTEMPTS=5
          
          while [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; do
            git add -- "$CONFIG_FILE"

            if git diff --cached --quiet -- "$CONFIG_FILE"; then
              echo "✅ Shared manifest is already up to date."
              exit 0
            fi

            git commit -m "ci(vendor-broadcast): add $SHARED_ID $SHARED_VERSION"

            if git push origin "HEAD:$TARGET_BRANCH"; then
              exit 0
            fi

            if [ "$ATTEMPT" -eq "$MAX_ATTEMPTS" ]; then
              echo "❌ Error: Failed to push shared manifest update after $MAX_ATTEMPTS attempts."
          
              exit 1
            fi

            echo "⏳ Push rejected, refreshing from latest $TARGET_BRANCH and retrying (Attempt $((ATTEMPT + 1))/$MAX_ATTEMPTS)."
            ATTEMPT=$((ATTEMPT + 1))
            git fetch origin "$TARGET_BRANCH"
            git reset --hard "origin/$TARGET_BRANCH"

            apply_manifest_update
            APPLY_STATUS=$?
            
            if [ "$APPLY_STATUS" -eq 2 ]; then
              echo "✅ Shared manifest already contains $SHARED_ID@$SHARED_VERSION after refresh."
          
              exit 0
            fi
            
            if [ "$APPLY_STATUS" -ne 0 ]; then
              exit 1
            fi
          done

          echo "❌ Error: Retry loop exited unexpectedly."
          
          exit 1
