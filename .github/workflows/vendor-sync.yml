name: Vendor Sync


on:
  push:
    paths:
      - 'gitops-vendor.json'
  repository_dispatch:
    types:
      - vendor-code-updated


jobs:
  call_vendor_sync:
    uses: leoweyr/gitops-vendor-sync-workflow/.github/workflows/reusable-vendor-sync.yml@develop
    with:
      vendor_config: 'gitops-vendor.json'
    secrets:
      ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
