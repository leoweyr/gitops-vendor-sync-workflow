<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Styles. -->
  <defs>
    <!-- Vibrant purple gradient for the octopus body. -->
    <radialGradient id="bodyGrad" cx="30%" cy="30%" r="70%" fx="30%" fy="30%">
      <stop offset="0%" style="stop-color:#9f7aea;stop-opacity:1" /> <!-- Lighter purple. -->
      <stop offset="100%" style="stop-color:#553c9a;stop-opacity:1" /> <!-- Darker purple. -->
    </radialGradient>
    
    <!-- Tentacle gradient. -->
    <linearGradient id="tentacleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#805ad5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6b46c1;stop-opacity:1" />
    </linearGradient>

    <!-- Mailbag gradient. -->
    <linearGradient id="mailbagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#48bb78;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2f855a;stop-opacity:1" />
    </linearGradient>

    <!-- Drop shadow filter. -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Circle background. -->
  <circle cx="256" cy="256" r="240" fill="#f7fafc" stroke="#cbd5e0" stroke-width="12"/>

  <!-- Main group: friendly octopus. -->
    <g transform="translate(0, 40)" filter="url(#shadow)"></g>
    
    <!-- === Rear legs (depth). === -->
    <path d="M228,336 L228,424 Q226,444 214,434" fill="none" stroke="#553c9a" stroke-width="20" stroke-linecap="round"/>
    <path d="M284,336 L284,424 Q286,444 298,434" fill="none" stroke="#553c9a" stroke-width="20" stroke-linecap="round"/>

    <!-- === Body Shape. === -->
    <!-- Bulbous head (Squid-like but rounder). -->
    <ellipse cx="256" cy="220" rx="110" ry="130" fill="url(#bodyGrad)"/>
    
    <!-- Body highlight (glossy look). -->
    <ellipse cx="210" cy="180" rx="40" ry="25" fill="#ffffff" opacity="0.15" transform="rotate(-20, 210, 180)"/>

    <!-- === Face. === -->
    <g transform="translate(0, 10) rotate(8, 256, 220)">
      <!-- Left eye. -->
      <circle cx="210" cy="220" r="32" fill="#ffffff" stroke="#4a5568" stroke-width="3"/>
      <circle cx="198" cy="230" r="10" fill="#2d3748"/> <!-- Pupil (looking to bag-mail hand). -->
      <circle cx="202" cy="226" r="3" fill="#ffffff"/> <!-- Shine. -->

      <!-- Right eye. -->
      <circle cx="302" cy="220" r="32" fill="#ffffff" stroke="#4a5568" stroke-width="3"/>
      <circle cx="289" cy="229" r="10" fill="#2d3748"/> <!-- Pupil (looking to bag-mail hand). -->
      <circle cx="293" cy="225" r="3" fill="#ffffff"/> <!-- Shine. -->
      
      <!-- Cheeks/Blush. -->
      <ellipse cx="170" cy="250" rx="12" ry="8" fill="#feb2b2" opacity="0.5"/>
      <ellipse cx="342" cy="250" rx="12" ry="8" fill="#feb2b2" opacity="0.5"/>
    </g>


    <!-- === Crossbody mailbag (octopus right side / viewer left). === -->
    <g transform="translate(0, 6)">
      <!-- Strap. -->
      <path d="M338,278 Q256,296 168,322" fill="none" stroke="#2f855a" stroke-width="14" stroke-linecap="round" opacity="0.9"/>
      <path d="M342,276 Q260,294 171,320" fill="none" stroke="#9ae6b4" stroke-width="5" stroke-linecap="round" opacity="0.85"/>

      <!-- Strap buckle near left arm. -->
      <g transform="translate(332,268) rotate(-18)">
        <rect x="0" y="0" width="20" height="14" rx="3" ry="3" fill="#e2e8f0" stroke="#2f855a" stroke-width="2"/>
        <line x1="10" y1="2" x2="10" y2="12" stroke="#2f855a" stroke-width="2"/>
        <rect x="-4" y="4" width="8" height="6" rx="2" ry="2" fill="#68d391" stroke="#2f855a" stroke-width="1.5"/>
      </g>

      <!-- Bag. -->
      <g transform="translate(118, 292) rotate(-8)">
        <rect x="0" y="0" width="118" height="86" rx="18" ry="18" fill="url(#mailbagGrad)" stroke="#22543d" stroke-width="4"/>
        <path d="M0,28 Q59,-2 118,28" fill="#68d391" stroke="#22543d" stroke-width="4"/>
        <path d="M4,36 L114,36 L97,64 Q59,78 21,64 Z" fill="#9ae6b4" opacity="0.65"/>
        <circle cx="59" cy="38" r="7" fill="#22543d"/>
      </g>
    </g>


    <!-- === Front tentacles (active arms). === -->

    <!-- Front legs (standing pose). -->
    <path d="M246,340 L246,428 Q244,450 232,440" fill="none" stroke="#8b5cf6" stroke-width="20" stroke-linecap="round"/>
    <path d="M266,340 L266,428 Q268,450 280,440" fill="none" stroke="#8b5cf6" stroke-width="20" stroke-linecap="round"/>

    
    <!-- Right arm (viewer left) - pulling mail from bag. -->
    <path d="M188,304 Q166,318 170,334" fill="none" stroke="url(#tentacleGrad)" stroke-width="28" stroke-linecap="round"/>

    <!-- Mail being pulled from the bag. -->
    <g transform="translate(148, 302) rotate(-18)">
      <rect x="0" y="0" width="56" height="38" rx="4" ry="4" fill="#fffaf0" stroke="#2d3748" stroke-width="2.4"/>
      <path d="M0,0 L28,19 L56,0" fill="none" stroke="#2d3748" stroke-width="2.2"/>
      <line x1="12" y1="26" x2="45" y2="26" stroke="#a0aec0" stroke-width="2"/>
    </g>

    <!-- Tentacle Tip (hand). -->
    <circle cx="170" cy="334" r="18" fill="#805ad5"/>
    <circle cx="170" cy="334" r="8" fill="#d6bcfa" opacity="0.8"/> <!-- Sucker. -->


    <!-- Left arm (viewer right) - carrying a large keyring. -->
    <path d="M318,302 L350,272" fill="none" stroke="url(#tentacleGrad)" stroke-width="28" stroke-linecap="round"/>

    <!-- Hand. -->
    <circle cx="350" cy="272" r="18" fill="#805ad5"/>
    <circle cx="350" cy="272" r="8" fill="#d6bcfa" opacity="0.6"/>

    <!-- Keyring with many keys. -->
    <g transform="translate(372, 272)">
      <circle cx="0" cy="0" r="15" fill="none" stroke="#718096" stroke-width="5"/>

      <line x1="-8" y1="12" x2="-24" y2="38" stroke="#718096" stroke-width="3" stroke-linecap="round"/>
      <line x1="0" y1="15" x2="2" y2="46" stroke="#718096" stroke-width="3" stroke-linecap="round"/>
      <line x1="9" y1="11" x2="24" y2="36" stroke="#718096" stroke-width="3" stroke-linecap="round"/>

      <g transform="translate(-28,42) rotate(18)">
        <circle cx="0" cy="0" r="5" fill="none" stroke="#a0aec0" stroke-width="3"/>
        <rect x="5" y="-2" width="18" height="4" fill="#a0aec0"/>
        <rect x="18" y="-2" width="3" height="8" fill="#a0aec0"/>
        <rect x="22" y="-2" width="3" height="6" fill="#a0aec0"/>
      </g>
      <g transform="translate(2,50) rotate(-4)">
        <circle cx="0" cy="0" r="5" fill="none" stroke="#cbd5e0" stroke-width="3"/>
        <rect x="5" y="-2" width="20" height="4" fill="#cbd5e0"/>
        <rect x="20" y="-2" width="3" height="8" fill="#cbd5e0"/>
        <rect x="24" y="-2" width="3" height="6" fill="#cbd5e0"/>
      </g>
      <g transform="translate(26,40) rotate(-24)">
        <circle cx="0" cy="0" r="5" fill="none" stroke="#a0aec0" stroke-width="3"/>
        <rect x="5" y="-2" width="17" height="4" fill="#a0aec0"/>
        <rect x="16" y="-2" width="3" height="8" fill="#a0aec0"/>
        <rect x="20" y="-2" width="3" height="6" fill="#a0aec0"/>
      </g>
    </g>
</svg>
